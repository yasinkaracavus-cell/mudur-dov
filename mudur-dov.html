<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Müdürü Döv!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #1a252f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  cursor: none;
  user-select: none;
}

h1 {
  color: #e74c3c;
  font-size: 2.8em;
  text-shadow: 3px 3px 0 #922b21, -1px -1px 0 #922b21;
  margin-bottom: 20px;
  letter-spacing: 3px;
  animation: title-pulse 2s ease-in-out infinite;
}
@keyframes title-pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* ---- ARENA ---- */
#arena {
  position: relative;
  width: 720px;
  height: 430px;
  background: linear-gradient(180deg, #d5d8dc 0%, #d5d8dc 68%, #7d6608 68%, #6e5f08 100%);
  border-radius: 16px;
  border: 4px solid #0e1b28;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}

/* wallpaper stripes */
#arena::before {
  content: '';
  position: absolute;
  inset: 0 0 32% 0;
  background: repeating-linear-gradient(
    90deg, transparent, transparent 50px,
    rgba(0,0,0,0.04) 50px, rgba(0,0,0,0.04) 51px
  );
  pointer-events: none;
}

/* baseboard */
#arena::after {
  content: '';
  position: absolute;
  bottom: 32%;
  left: 0; right: 0;
  height: 8px;
  background: #5d4e37;
}

/* ---- WINDOW ---- */
.window {
  position: absolute;
  top: 25px; left: 50px;
  width: 110px; height: 130px;
  background: linear-gradient(135deg, #85c1e9 40%, #aed6f1);
  border: 8px solid #784212;
  border-radius: 4px 4px 2px 2px;
}
.window::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: 50%; width: 4px;
  background: #784212;
  transform: translateX(-50%);
}
.window::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  top: 50%; height: 4px;
  background: #784212;
  transform: translateY(-50%);
}

/* ---- GEYIKLI HALI ---- */
#tapestry {
  position: absolute;
  top: 12px;
  right: 52px;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.6);
  border-radius: 3px;
}

/* ---- PLANT ---- */
.plant {
  position: absolute;
  bottom: 31%;
  left: 40px;
  font-size: 50px;
  line-height: 1;
}

/* ---- DESK ---- */
#desk {
  position: absolute;
  bottom: 112px;
  left: 50%;
  transform: translateX(-50%);
  width: 340px; height: 22px;
  background: linear-gradient(to bottom, #935116, #784212);
  border-radius: 5px;
  box-shadow: 0 8px 0 #4a2c0a;
}

/* desk items */
.desk-item {
  position: absolute;
  bottom: 134px;
}
.monitor { left: calc(50% - 150px); font-size: 36px; }
.papers  { left: calc(50% - 72px);  font-size: 20px; }
.coffee  { left: calc(50% + 78px);  font-size: 22px; }
.raki-glass { left: calc(50% + 113px); }

/* ---- NAMEPLATE ---- */
#nameplate {
  position: absolute;
  bottom: 116px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #c9a800 0%, #f5d560 45%, #c9a800 100%);
  border: 2px solid #7a6200;
  border-radius: 4px;
  padding: 3px 14px 4px;
  font-size: 11px;
  font-weight: 900;
  font-family: Georgia, serif;
  color: #1a0a00;
  white-space: nowrap;
  letter-spacing: 0.8px;
  z-index: 10;
  box-shadow: 0 2px 5px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
}

/* ---- MANAGER ---- */
#manager {
  position: absolute;
  bottom: 134px;
  left: 50%;
  transform: translateX(-50%);
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* head */
#head {
  width: 72px; height: 80px;
  background: #fad7c0;
  border-radius: 50% 50% 45% 45%;
  position: relative;
  border: 2px solid #e6b89d;
  z-index: 2;
}

/* hair */
#head::before {
  content: '';
  position: absolute;
  top: -10px; left: 3px; right: 3px;
  height: 28px;
  background: #2c1a0e;
  border-radius: 55% 55% 20% 20%;
}

.ear {
  position: absolute;
  width: 14px; height: 20px;
  background: #fad7c0;
  border: 2px solid #e6b89d;
  border-radius: 50%;
  top: 22px;
}
.ear.l { left: -11px; }
.ear.r { right: -11px; }

.eye {
  position: absolute;
  width: 11px; height: 11px;
  background: #1a1a1a;
  border-radius: 50%;
  top: 28px;
  transition: height 0.1s, border-radius 0.1s;
}
.eye.l { left: 13px; }
.eye.r { right: 13px; }

.brow {
  position: absolute;
  width: 16px; height: 4px;
  background: #2c1a0e;
  border-radius: 2px;
  top: 21px;
  transition: transform 0.2s;
}
.brow.l { left: 10px; transform: rotate(5deg); }
.brow.r { right: 10px; transform: rotate(-5deg); }

#nose {
  position: absolute;
  bottom: 22px;
  left: 50%; transform: translateX(-50%);
  width: 10px; height: 7px;
  border-bottom: 3px solid #d4a090;
  border-left: 2px solid #d4a090;
  border-right: 2px solid #d4a090;
  border-radius: 0 0 50% 50%;
}

#mouth {
  position: absolute;
  bottom: 12px;
  left: 50%; transform: translateX(-50%);
  width: 22px; height: 9px;
  border-bottom: 3px solid #c0392b;
  border-radius: 0 0 50% 50%;
  transition: all 0.15s;
}

/* speech bubble */
#speech {
  position: absolute;
  background: white;
  border: 2px solid #333;
  border-radius: 12px;
  padding: 7px 11px;
  font-size: 13px;
  font-weight: bold;
  color: #222;
  max-width: 160px;
  text-align: center;
  white-space: normal;
  top: -80px;
  right: -100px;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 20;
  pointer-events: none;
  line-height: 1.4;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
}
#speech::after {
  content: '';
  position: absolute;
  bottom: -11px; left: 18px;
  border: 6px solid transparent;
  border-top-color: #333;
}

/* body */
#body {
  width: 95px; height: 105px;
  background: #1a5276;
  border-radius: 12px 12px 0 0;
  position: relative;
  margin-top: -2px;
  z-index: 1;
}

#body::before {
  content: '';
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 24px; height: 18px;
  background: #ecf0f1;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}

#tie {
  position: absolute;
  top: 18px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-top: 58px solid #c62828;
  transition: transform 0.3s ease;
  transform-origin: top center;
}

.arm {
  position: absolute;
  width: 20px; height: 75px;
  background: #1a5276;
  border-radius: 10px;
  top: 12px;
}
.arm.l { left: -16px; transform: rotate(8deg); }
.arm.r { right: -16px; transform: rotate(-8deg); }

.hand {
  position: absolute;
  width: 20px; height: 20px;
  background: #fad7c0;
  border-radius: 50%;
  bottom: -2px;
}

/* ---- ANIMATIONS ---- */
@keyframes head-bounce {
  0%   { transform: rotate(0deg) translateY(0); }
  20%  { transform: rotate(-18deg) translateY(-12px); }
  50%  { transform: rotate(12deg) translateY(-6px); }
  75%  { transform: rotate(-8deg) translateY(-2px); }
  100% { transform: rotate(0deg) translateY(0); }
}
.bouncing { animation: head-bounce 0.35s ease forwards; }

@keyframes arena-shake {
  0%,100% { transform: translate(0,0); }
  20%  { transform: translate(-6px, 4px); }
  40%  { transform: translate(6px, -4px); }
  60%  { transform: translate(-4px, 6px); }
  80%  { transform: translate(4px, -4px); }
}
.shaking { animation: arena-shake 0.3s ease; }

/* ---- FLOATING FX ---- */
.star-fx {
  position: fixed;
  pointer-events: none;
  font-size: 28px;
  z-index: 900;
  animation: star-out 0.65s ease-out forwards;
}
@keyframes star-out {
  0%   { opacity: 1; transform: translate(0,0) scale(1.3); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
}

.hit-word {
  position: fixed;
  pointer-events: none;
  font-size: 36px;
  font-weight: 900;
  color: #f1c40f;
  text-shadow: 2px 2px 0 #d68910, -2px -2px 0 #d68910, 2px -2px 0 #d68910, -2px 2px 0 #d68910;
  z-index: 900;
  animation: word-out 0.75s ease-out forwards;
}
@keyframes word-out {
  0%   { opacity: 1; transform: translate(-50%, 0) scale(1.4); }
  100% { opacity: 0; transform: translate(-50%, -100px) scale(0.8); }
}

/* ---- SCOREBOARD ---- */
#scoreboard {
  display: flex;
  gap: 50px;
  margin-top: 18px;
  color: white;
}
.stat { text-align: center; }
.stat-val {
  font-size: 2.6em;
  font-weight: 900;
  color: #e74c3c;
  text-shadow: 2px 2px 0 #7b241c;
}
.stat-val.pop { animation: pop 0.2s ease; }
@keyframes pop { 0%,100% {transform:scale(1);} 50% {transform:scale(1.4);} }
.stat-label { font-size: 0.78em; color: #85929e; letter-spacing: 2px; text-transform: uppercase; }

#tip { color: #566573; font-size: 0.82em; margin-top: 10px; letter-spacing: 1px; }

/* ---- STICK CURSOR ---- */
#stick {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  transform-origin: 40px 20px;
  transition: transform 0.1s ease;
}
</style>
</head>

<script>
const arena    = document.getElementById('arena');
const head     = document.getElementById('head');
const eyeL     = document.getElementById('eye-l');
const eyeR     = document.getElementById('eye-r');
const browL    = document.getElementById('brow-l');
const browR    = document.getElementById('brow-r');
const mouth    = document.getElementById('mouth');
const tie      = document.getElementById('tie');
const speech   = document.getElementById('speech');
const scoreVal = document.getElementById('score-val');
const comboVal = document.getElementById('combo-val');
const bestVal  = document.getElementById('best-val');
const stick    = document.getElementById('stick');

let score = 0, combo = 1, best = 0;
let comboTimer = null;
let isSwinging = false;
const REST_ANGLE = -35;

const phrases = [
  "Beni bırakın!",
  "Bu son uyarım!",
  "İK'yı arayacağım!",
  "Sizi şikayet ederim!",
  "Hakkınızı helal etmiyorum!",
  "Au au auuuu!",
  "Bitirim sizi!",
  "Toplantıya gelin HEMEN!",
  "Zam yok bu sene!",
  "Fazla mesai yazarım!",
  "Disiplin soruşturması!",
  "Anama küsmeyin!",
  "Bu iş böyle gitmez!",
  "Performans değerlendirmesi!",
  "Raporunuzu istiyorum!",
  "Bir dakika durun ya!",
  "Saçmalamayın lütfen!",
  "Bütçeyi kıstım size!",
  "E-posta attım, neden okumadınız?",
  "Bu böyle yapılmaz!",
];

const hitWords = ["BAM!", "POW!", "ÇAAT!", "VRUP!", "DÜFT!", "BOOM!", "ZAP!", "KÜFT!"];
const stars    = ["⭐", "💫", "✨", "🌟", "💥", "⚡"];

document.addEventListener('mousemove', (e) => {
  stick.style.left = (e.clientX - 40) + 'px';
  stick.style.top  = (e.clientY - 20) + 'px';
  if (!isSwinging) {
    stick.style.transition = 'transform 0.08s ease';
    stick.style.transform = `rotate(${REST_ANGLE}deg)`;
  }
});

document.addEventListener('mousedown', (e) => {
  if (isSwinging) return;
  isSwinging = true;
  stick.style.transition = 'transform 0.07s ease-in';
  stick.style.transform  = 'rotate(75deg)';
  setTimeout(() => {
    checkHit(e.clientX, e.clientY);
    stick.style.transition = 'transform 0.18s ease-out';
    stick.style.transform  = `rotate(${REST_ANGLE}deg)`;
    setTimeout(() => { isSwinging = false; }, 180);
  }, 70);
});

function checkHit(x, y) {
  const r = head.getBoundingClientRect();
  const margin = 20;
  if (x >= r.left - margin && x <= r.right + margin &&
      y >= r.top  - margin && y <= r.bottom + margin) {
    doHit(x, y);
  }
}

function doHit(x, y) {
  score++;
  combo++;
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => { combo = 1; setCombo(1); }, 1600);
  if (score > best) { best = score; popVal(bestVal, best); }
  popVal(scoreVal, score);
  setCombo(combo);

  head.classList.remove('bouncing');
  void head.offsetWidth;
  head.classList.add('bouncing');

  arena.classList.remove('shaking');
  void arena.offsetWidth;
  arena.classList.add('shaking');

  const ta = (Math.random() - 0.5) * 80;
  tie.style.transform = `translateX(-50%) rotate(${ta}deg)`;

  eyeL.style.height = eyeR.style.height = '3px';
  eyeL.style.borderRadius = eyeR.style.borderRadius = '2px';
  setTimeout(() => {
    eyeL.style.height = eyeR.style.height = '11px';
    eyeL.style.borderRadius = eyeR.style.borderRadius = '50%';
  }, 350);

  browL.style.transform = 'rotate(-12deg)';
  browR.style.transform = 'rotate(12deg)';
  setTimeout(() => {
    browL.style.transform = 'rotate(5deg)';
    browR.style.transform = 'rotate(-5deg)';
  }, 500);

  mouth.style.borderBottom = 'none';
  mouth.style.borderTop    = '3px solid #c0392b';
  mouth.style.borderRadius = '50% 50% 0 0';
  mouth.style.bottom       = '10px';
  setTimeout(() => {
    mouth.style.borderTop    = 'none';
    mouth.style.borderBottom = '3px solid #c0392b';
    mouth.style.borderRadius = '0 0 50% 50%';
    mouth.style.bottom       = '12px';
  }, 450);

  const txt = phrases[Math.floor(Math.random() * phrases.length)];
  speech.textContent = txt;
  speech.style.opacity = '1';
  clearTimeout(speech._t);
  speech._t = setTimeout(() => { speech.style.opacity = '0'; }, 2200);

  for (let i = 0; i < 6; i++) {
    spawnStar(x, y, stars[Math.floor(Math.random() * stars.length)]);
  }
  spawnWord(x, y - 50, hitWords[Math.floor(Math.random() * hitWords.length)]);
}

function setCombo(n) {
  comboVal.textContent = 'x' + n;
  comboVal.style.color = n > 5 ? '#e74c3c' : (n > 1 ? '#f39c12' : '#e74c3c');
  if (n > 1) popVal(comboVal, null);
}

function popVal(el, val) {
  if (val !== null) el.textContent = val;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function spawnStar(x, y, emoji) {
  const el = document.createElement('div');
  el.className = 'star-fx';
  el.textContent = emoji;
  const angle = Math.random() * Math.PI * 2;
  const dist  = 50 + Math.random() * 80;
  el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
  el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
  el.style.left = (x - 14) + 'px';
  el.style.top  = (y - 14) + 'px';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function spawnWord(x, y, word) {
  const el = document.createElement('div');
  el.className = 'hit-word';
  el.textContent = word;
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function scheduleBlink() {
  setTimeout(() => {
    eyeL.style.height = eyeR.style.height = '2px';
    setTimeout(() => {
      eyeL.style.height = eyeR.style.height = '11px';
      scheduleBlink();
    }, 120);
  }, 2500 + Math.random() * 3000);
}
scheduleBlink();

const idleLines = [
  "Neden rapor gelmiyor?",
  "Hep geç geliyorsunuz...",
  "Bu ay hedefler tutmadı.",
  "Toplantıyı kaçırdınız!",
  "KPI'lar berbat!",
  "Bütçe aşımı var!",
];
function idleGroan() {
  setTimeout(() => {
    if (speech.style.opacity === '0' || speech.style.opacity === '') {
      speech.textContent = idleLines[Math.floor(Math.random() * idleLines.length)];
      speech.style.opacity = '1';
      setTimeout(() => { speech.style.opacity = '0'; }, 2500);
    }
    idleGroan();
  }, 5000 + Math.random() * 6000);
}
idleGroan();

head.addEventListener('animationend',  () => head.classList.remove('bouncing'));
arena.addEventListener('animationend', () => arena.classList.remove('shaking'));
</script>
</body>
</html>
